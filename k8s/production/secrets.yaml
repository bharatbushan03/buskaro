# BusKaro Secrets - Base64 encoded values
# Generate secrets: echo -n 'your-secret' | base64
apiVersion: v1
kind: Secret
metadata:
  name: buskaro-secrets
  namespace: buskaro
type: Opaque
data:
  # JWT Secret - Generate with: openssl rand -base64 32
  JWT_SECRET: ""
  
  # Database Password
  DB_PASSWORD: ""
  
  # Razorpay Credentials
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  
  # Google Maps API Key
  GOOGLE_MAPS_API_KEY: ""
  
  # PostgreSQL Password
  POSTGRES_PASSWORD: ""
---
# Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: buskaro
type: Opaque
data:
  username: ""
  password: ""
---
# TLS Certificate (optional - use cert-manager in production)
apiVersion: v1
kind: Secret
metadata:
  name: buskaro-tls
  namespace: buskaro
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
