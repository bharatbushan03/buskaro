# BusKaro Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buskaro-backend
  namespace: buskaro
  labels:
    app: buskaro-backend
spec:
  replicas: 3  # Multiple instances for high availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: buskaro-backend
  template:
    metadata:
      labels:
        app: buskaro-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/bharatbushan03/buskaro-backend:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: buskaro-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: buskaro-config
              key: PORT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: buskaro-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: buskaro-config
              key: REDIS_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: buskaro-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - buskaro-backend
              topologyKey: kubernetes.io/hostname
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: buskaro-backend
  namespace: buskaro
  labels:
    app: buskaro-backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: buskaro-backend
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: buskaro-backend-hpa
  namespace: buskaro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: buskaro-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
